<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Outer Sacred Sunburst Rays (8 Rays of the Philippine Sun) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- 8 Sun Rays -->
    <path d="M 0,-210 L 16,-120 L -16,-120 Z" fill="url(#goldGrad)" />
    <path d="M 0,210 L 16,120 L -16,120 Z" fill="url(#goldGrad)" />
    <path d="M -210,0 L -120,16 L -120,-16 Z" fill="url(#goldGrad)" />
    <path d="M 210,0 L 120,16 L 120,-16 Z" fill="url(#goldGrad)" />
    
    <path d="M -148,-148 L -92,-78 L -78,-92 Z" fill="url(#goldGrad)" />
    <path d="M 148,-148 L 92,-78 L 78,-92 Z" fill="url(#goldGrad)" />
    <path d="M -148,148 L -92,78 L -78,92 Z" fill="url(#goldGrad)" />
    <path d="M 148,148 L 92,78 L 78,92 Z" fill="url(#goldGrad)" />

    <!-- Radiant Ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 8" />
    <circle cx="0" cy="0" r="74" fill="#091428" stroke="url(#cyanGrad)" stroke-width="4" />

    <!-- Ancient Baybayin 'A' (ᜀ) Glyph for TALISMAN -->
    <path d="M -24,-38 C -4,-48 24,-48 34,-24 C 44,0 12,24 -14,28 C -32,32 -36,54 -18,62 C -4,68 18,62 32,46" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -30,-12 L -6,-12" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="28" cy="-4" r="6" fill="#00e5ff" />
  </g>

  <!-- Title Ribbon -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" text-anchor="middle" letter-spacing="8">TALISMAN</text>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#00e5ff" text-anchor="middle" letter-spacing="4">PHILIPPINE MOBA</text>
</svg>
